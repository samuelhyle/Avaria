name: Storefront maintenance
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  maintenance:
    # Set the verified production HTTPS URL and CRON_SECRET before enabling.
    if: vars.MAINTENANCE_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release expired reservations, retry email, purge disabled account shells
        env:
          MAINTENANCE_BASE_URL: ${{ vars.MAINTENANCE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          case "$MAINTENANCE_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 5 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${MAINTENANCE_BASE_URL%/}/api/cron/maintenance"
