name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: averianlabs-web
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: [5432:5432]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      TEST_DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-do-not-use-anywhere-real-0000000000
      AUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_local_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_local_test
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_local_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10, package_json_file: averianlabs-web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: averianlabs-web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:i18n
      - run: pnpm check:i18n:usage
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm audit --prod --audit-level=high
  storefront:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: [5432:5432]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      TEST_DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-do-not-use-anywhere-real-0000000000
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10, package_json_file: averianlabs-web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: averianlabs-web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec tsx scripts/seed-test-commerce.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: averianlabs-web/test-results/
