<script>
const copy={en:{concept:'Visual concept · 14 October 2026 · local preview',home:'Home',catalog:'Catalogue',product:'Product page',products:'Products',docs:'Batch documents',quality:'Quality',support:'Support',account:'Account',cart:'Cart',menu:'Menu',close:'Close',eyebrow:'For laboratory research',hero:'Research materials<br>for laboratory work.',intro:'Find a product, check the available documentation, and ask about current availability.',browse:'Browse catalogue',viewDocs:'View batch documents',researchOnly:'For laboratory research only.',example:'Reference product · layout example',available:'Not available for direct purchase',availability:'Availability',unavailable:'Currently unavailable',documents:'Documents',noDocs:'No published documents',illustration:'Illustration',viewProduct:'Product details',sku:'SKU',sizes:'Listed quantities',step1:'Find the right material',step1sub:'Search by product name or SKU.',step2:'Check the documentation',step2sub:'Read records for the exact product and batch.',step3:'Confirm availability',step3sub:'Enquire before placing an order.',featured:'Explore the reference catalogue',featuredSub:'A compact view of products and their current information.',seeAll:'View catalogue',noAssigned:'No released batch assigned',details:'View details',resources:'Useful information,<br>where you need it.',resourcesBody:'Keep product identity, analytical results and purchasing information easy to find and clearly separated.',methods:'Understanding laboratory reports',methodsSub:'What different analytical methods can tell you',procurement:'Purchasing information',procurementSub:'Availability, documentation and quotation enquiries',search:'Search by product name or SKU…',allTypes:'All material types',peptides:'Peptides',supplies:'Laboratory supplies',peptide:'Peptide',labSupply:'Laboratory supply',sampleCount:'4 reference examples · layout sample',searchCount:'reference examples',material:'Material',size:'Listed quantity',noRecord:'No document available',docTitle:'Product and batch documentation',docBody:'Check the original report for the selected product and batch. Missing records are shown explicitly.',docEmpty:'No published documents are available for this example.',docNote:'There is no released batch report to view. Contact the team about the documentation you require.',reviewSpecs:'Specifications awaiting review',specBody:'Chemical identifiers, composition and handling information require approved product records.',selectSize:'Choose a listed quantity',quote:'Enquire about availability',quoteDesc:'Ask about your required SKU, quantity and batch documentation.',quotePanel:'Availability enquiry',askSku:'Ask about this SKU',quoteHelp:'Availability, price and documentation must be confirmed. This example is not purchasable.',identity:'Product information',generic:'Laboratory research material. Review the product-specific records before use.',back:'Catalogue',questions:'Need more information?',questionsSub:'Ask about the SKU, original reports or purchasing requirements.',contact:'Contact the team',empty:'No matching examples',emptySub:'Try another product name or SKU, or choose all material types.',footerTag:'Materials and information for laboratory purchasing.',privacy:'Privacy',shipping:'Purchasing',footerNote:'Design preview using reference catalogue examples. No ordering or sending is enabled.',quoteName:'Contact name',quoteEmail:'Email address',preview:'Preview enquiry state',previewSuccess:'Preview only. Nothing was submitted or sent.',dialogNotice:'This is an interactive design concept. It is not connected to the live database, ordering system or assistant.',qualityBody:'Product identity, chromatographic purity and material content are different questions. Show each result only when the original product or batch record supports it.',supportBody:'A clear support route for SKU availability, original documents and purchasing enquiries.',filter:'Filter',filters:'Material type'},fi:{concept:'Ulkoasukonsepti · 14. - ja eräasiakirjat',docBody:'Tarkista valitun tuotteen ja erän alkuperäinen raportti. Puuttuvat tiedot ilmoitetaan selkeästi.',docEmpty:'Tälle esimerkkituotteelle ei ole julkaistuja asiakirjoja.',docNote:'Vapautetun erän raporttia ei ole katseltavissa. Kysy tiimiltä tarvitsemistasi asiakirjoista.',reviewSpecs:'Tekniset tiedot odottavat tarkistusta',specBody:'Kemialliset tunnisteet, koostumus ja käsittelytiedot edellyttävät hyväksyttyjä tuotekohtaisia asiakirjoja.',selectSize:'Valitse ilmoitettu määrä',quote:'Kysy saatavuudesta',quoteDesc:'Kysy tarvitsemasi tuotekoodin saatavuudesta, määrästä ja eräasiakirjoista.',quotePanel:'Saatavuuskysely',askSku:'Kysy tästä tuotekoodista',quoteHelp:'Saatavuus, hinta ja asiakirjat on vahvistettava. Tätä esimerkkituotetta ei voi ostaa.',identity:'Tuotetiedot',generic:'Materiaali laboratoriotutkimukseen. Tarkista tuotekohtaiset asiakirjat ennen käyttöä.',back:'Valikoima',questions:'Tarvitsetko lisätietoja?',questionsSub:'Kysy tuotekoodista, alkuperäisistä raporteista tai hankinnan vaatimuksista.',contact:'Ota yhteyttä',empty:'Ei vastaavia esimerkkejä',emptySub:'Kokeile toista nimeä tai tuotekoodia tai valitse kaikki materiaalityypit.',footerTag:'Materiaaleja ja tietoa laboratoriohankintoihin.',privacy:'Tietosuoja',shipping:'Hankinnat',footerNote:'Ulkoasun esikatselu viitevalikoiman tuotteilla. Tilaaminen ja viestien lähettäminen eivät ole käytössä.',quoteName:'Yhteyshenkilön nimi',quoteEmail:'Sähköpostiosoite',preview:'Esikatsele kyselyn tilaa',previewSuccess:'Vain esikatselu. Mitään ei lähetetty tai tallennettu.',dialogNotice:'Tämä on vuorovaikutteinen ulkoasukonsepti. Sitä ei ole yhdistetty tietokantaan, tilausjärjestelmään tai avustajaan.',qualityBody:'Aineen tunnistus, kromatografinen puhtaus ja aineen määrä vastaavat eri kysymyksiin. Tulos näytetään vain, kun alkuperäinen tuote- tai eräasiakirja tukee sitä.',supportBody:'Selkeä yhteydenottokanava tuotekoodien saatavuuteen, alkuperäisiin asiakirjoihin ja hankintoihin liittyviin kysymyksiin.',filter:'Suodata',filters:'Materiaalityyppi'}};
const icons={arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',document:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 12h8m-8 4h6"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',cart:'<path d="M3 3h2l3 13h10l3-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-11v1"/>',chevron:'<path d="m9 5 7 7-7 7"/>'};
const icon=(key,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[key]}</svg>`;
const examples=[{id:'bpc-157',name:'BPC-157',type:'peptides',variants:[['5 mg','BPC157-5'],['10 mg','BPC157-10']]},{id:'ghk-cu',name:'GHK-Cu',type:'peptides',variants:[['50 mg','GHKCU-50']]},{id:'retatrutide',name:'Retatrutide',fi:'Retatrutidi',type:'peptides',variants:[['20 mg','RETA-20']]},{id:'bac-water',name:'BAC water',fi:'BAC-vesi',type:'supplies',variants:[['10 mL','BACW-10']]}];
let locale='en',view='home',selected=examples[0],variant=0,searchQuery='',materialType='all';const t=key=>copy[locale][key];const productName=p=>locale==='fi'?(p.fi||p.name):p.name;const badge=()=>`<span class="badge"><span class="dot"></span>${t('unavailable')}</span>`;
function vial(name='BPC-157',sku='BPC157-5'){return `<div class="vial" aria-hidden="true"><div class="vial-body"></div><div class="vial-cap"></div><div class="vial-neck"></div><div class="vial-label">${name}<span>${sku}</span></div></div>`}
function mini(){return `<div class="mini-vial" aria-hidden="true">${vial('','')}</div>`}
function renderShell(){document.documentElement.lang=locale;document.querySelector('#conceptTitle').textContent=t('concept');document.querySelector('#conceptTabs').innerHTML=['home','catalog','product'].map(v=>`<button data-view="${v}" aria-pressed="${view===v}">${t(v)}</button>`).join('');document.querySelector('#primaryNav').innerHTML=`<button data-view="catalog" class="${view==='catalog'||view==='product'?'active':''}">${t('products')}</button><button data-dialog="docs">${t('docs')}</button><button data-dialog="quality">${t('quality')}</button><button data-dialog="support">${t('support')}</button>`;document.querySelector('#headerTools').innerHTML=`<button class="plain text" id="language" aria-label="${locale==='en'?'Switch to Finnish':'Vaihda englanniksi'}">${locale==='en'?'EN / FI':'FI / EN'}</button><button class="plain text account" data-dialog="account">${icon('user')}${t('account')}</button><button class="plain text cart" data-dialog="cart">${icon('cart')}${t('cart')}</button><button class="plain text mobile-menu" id="menu" aria-label="${t('menu')}" aria-expanded="false" aria-controls="mobileNav">${icon('menu')}</button>`;document.querySelector('#mobileNav').innerHTML=`<button data-view="catalog">${t('products')}</button><button data-dialog="docs">${t('docs')}</button><button data-dialog="quality">${t('quality')}</button><button data-dialog="support">${t('support')}</button>`;document.querySelector('#mobileNav').classList.remove('open');document.querySelector('#footerContent').innerHTML=`<div class="footer-top"><div><button class="brand" data-view="home"><span class="brand-chip">Æ</span>AverianLabs</button><p>${t('footerTag')}</p></div><div class="footer-links"><button data-dialog="docs">${t('docs')}</button><button data-dialog="support">${t('support')}</button><button data-dialog="privacy">${t('privacy')}</button></div></div><div class="footer-bottom"><span>© 2026 AverianLabs · ${t('researchOnly')}</span><span>${t('footerNote')}</span></div>`}
function compactCard(p){return `<article class="product-card"><div class="product-card-head"><div><h3>${productName(p)}</h3><div class="meta">${p.variants.map(v=>v[0]).join(' / ')} · <span class="mono">${p.variants[0][1]}</span></div></div>${mini()}</div>${badge()}<div class="product-card-bottom"><span>${t('noDocs')}</span><button class="text-link" data-product="${p.id}">${t('details')}${icon('arrow',15)}</button></div></article>`}
function home(){return `<section class="hero"><div><span class="eyebrow">${t('eyebrow')}</span><h1>${t('hero')}</h1><p class="hero-intro">${t('intro')}</p><div class="actions"><button class="button" data-view="catalog">${t('browse')}${icon('arrow')}</button><button class="button secondary" data-dialog="docs">${t('viewDocs')}</button></div><p class="helper">${t('researchOnly')}</p></div><article class="hero-card"><div class="card-top"><span>${t('example')}</span>${icon('document',16)}</div><div class="hero-product">${vial()}<div><h3>BPC-157</h3><span class="mono">BPC157-5 · BPC157-10</span><span class="size-chip">5 mg</span><span class="size-chip">10 mg</span></div></div><div class="record-lines"><div class="record-line"><span>${t('availability')}</span><strong>${t('unavailable')}</strong></div><div class="record-line"><span>${t('documents')}</span><strong>${t('noDocs')}</strong></div></div><div class="card-bottom"><p>${t('illustration')} · ${t('researchOnly')}</p><button class="text-link" data-product="bpc-157">${t('viewProduct')}${icon('arrow',15)}</button></div></article></section><section class="workflow" aria-label="${t('procurement')}">${[1,2,3].map(n=>`<div class="workflow-item"><span class="workflow-number">${n}</span><div><strong>${t('step'+n)}</strong><p>${t('step'+n+'sub')}</p></div></div>`).join('')}</section><section class="section"><div class="section-header"><div><h2>${t('featured')}</h2><p>${t('featuredSub')}</p></div><button class="text-link" data-view="catalog">${t('seeAll')}${icon('arrow',16)}</button></div><div class="compact-grid">${examples.map(compactCard).join('')}</div></section><section class="resource-section"><div><h2>${t('resources')}</h2><p>${t('resourcesBody')}</p></div><div class="resource-list">${[['document','docs','noAssigned'],['document','methods','methodsSub'],['info','procurement','procurementSub']].map(([i,k,sub])=>`<button class="resource-link" data-dialog="${k==='docs'?'docs':k==='methods'?'quality':'support'}">${icon(i,21)}<span><strong>${t(k)}</strong><small>${t(sub)}</small></span>${icon('arrow',17)}</button>`).join('')}</div></section>`}
function catalog(){return `<section class="page-intro"><div class="breadcrumb">AverianLabs / ${t('catalog')}</div><h1>${t('catalog')}</h1><p>${t('intro')}</p></section><div class="catalog-tools"><label class="search-box">${icon('search',19)}<input id="catalogSearch" type="search" aria-label="${t('search')}" placeholder="${t('search')}"></label><select id="materialType" aria-label="${t('filters')}"><option value="all">${t('allTypes')}</option><option value="peptides">${t('peptides')}</option><option value="supplies">${t('supplies')}</option></select><button class="plain" data-dialog="docs">${icon('document',17)}${t('docs')}</button></div><p class="result-label" id="resultCount">${t('sampleCount')}</p><section class="catalog-sheet" aria-label="${t('catalog')}"><div class="table-head" aria-hidden="true"><span>${t('material')}</span><span>${t('size')}</span><span>${t('availability')}</span><span>${t('documents')}</span><span></span></div><div id="catalogRows">${rows(examples)}</div></section><div class="catalog-note">${icon('info',17)}<p>${t('footerNote')} ${t('quoteHelp')}</p></div><section class="questions"><div><h3>${t('questions')}</h3><p>${t('questionsSub')}</p></div><button class="button secondary" data-dialog="support">${t('contact')}${icon('arrow',16)}</button></section>`}
function rows(products){return products.length?products.map(p=>`<article class="catalog-row"><div class="catalog-product">${mini()}<div><h3>${productName(p)}</h3><span class="mono">${p.variants[0][1]}</span></div></div><div class="catalog-cell size-cell"><span class="mobile-label">${t('size')}</span>${p.variants.map(v=>v[0]).join(' / ')}</div><div class="catalog-cell availability-cell"><span class="mobile-label">${t('availability')}</span>${badge()}</div><div class="catalog-cell document-cell"><span class="mobile-label">${t('documents')}</span><span>${t('noRecord')}<small>${t('noAssigned')}</small></span></div><button class="row-open" data-product="${p.id}" aria-label="${t('viewProduct')}: ${productName(p)}">${icon('arrow',20)}</button></article>`).join(''):`<div class="empty-results"><h3>${t('empty')}</h3><p>${t('emptySub')}</p></div>`}
function product(){const p=selected,v=p.variants[variant];return `<section class="pdp-header"><div class="breadcrumb"><button data-view="catalog">${t('back')}</button> / ${productName(p)}</div><div class="pdp-title-row"><div><h1>${productName(p)}</h1><p>${t(p.type==='supplies'?'labSupply':'peptide')} · ${t('researchOnly')}</p></div>${badge()}</div></section><div class="product-layout"><div class="details-column"><article class="product-identity"><div class="product-image">${vial(productName(p),v[1])}<small>${t('illustration')}</small></div><div><h3>${t('identity')}</h3><p>${t('generic')}</p><span class="mono">${t('sku')}: ${v[1]}</span><br><button class="text-link" data-dialog="quality">${t('methods')}${icon('arrow',14)}</button></div></article><section class="info-panel"><h3>${t('docTitle')}</h3><p>${t('docBody')}</p><div class="doc-empty">${icon('document',21)}<div><strong>${t('docEmpty')}</strong><p>${t('docNote')}</p></div></div><button class="text-link" data-dialog="docs">${t('viewDocs')}${icon('arrow',15)}</button></section><section class="info-panel"><h3>${t('reviewSpecs')}</h3><p style="margin-bottom:0">${t('specBody')}</p></section></div><aside class="purchase-panel"><h3>${t('quotePanel')}</h3><span class="field-label">${t('selectSize')}</span><div class="variant-row">${p.variants.map((x,i)=>`<button class="variant" data-variant="${i}" aria-pressed="${variant===i}"><strong>${x[0]}</strong><small>${x[1]}</small></button>`).join('')}</div><div class="purchase-status"><strong>${t('available')}</strong><p>${t('noAssigned')}</p></div><button class="button" data-dialog="quote">${t('quote')}${icon('arrow',17)}</button><button class="text-link" data-dialog="support">${t('askSku')}</button><p class="helper">${t('quoteHelp')}</p></aside></div><section class="questions"><div><h3>${t('questions')}</h3><p>${t('questionsSub')}</p></div><button class="button secondary" data-dialog="support">${t('contact')}${icon('arrow',16)}</button></section>`}
function render(scroll=false){renderShell();document.querySelector('#main').innerHTML=view==='home'?home():view==='catalog'?catalog():product();document.title=`AverianLabs · ${t(view)} · visual concept`;if(view==='catalog'){document.querySelector('#catalogSearch').value=searchQuery;document.querySelector('#materialType').value=materialType;filter()}if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function showDialog(kind){const title=kind==='quote'?t('quotePanel'):kind==='docs'?t('docTitle'):kind==='quality'?t('quality'):kind==='privacy'?t('privacy'):kind==='account'?t('account'):kind==='cart'?t('cart'):t('support');let content=kind==='quote'?`<p>${productName(selected)} · <span class="mono">${selected.variants[variant][1]}</span></p><p>${t('quoteDesc')}</p><label for="previewName">${t('quoteName')}</label><input id="previewName" autocomplete="off"><label for="previewEmail">${t('quoteEmail')}</label><input id="previewEmail" type="email" autocomplete="off"><button class="button" id="previewSubmit">${t('preview')}</button><div id="previewResult" role="status"></div>`:kind==='docs'?`<p>${t('docBody')}</p><div class="doc-empty">${icon('document',23)}<div><strong>${t('noDocs')}</strong><p>${t('docNote')}</p></div></div>`:kind==='quality'?`<p>${t('qualityBody')}</p><div class="doc-empty">${icon('document',21)}<div><strong>${t('reviewSpecs')}</strong><p>${t('specBody')}</p></div></div>`:`<p>${t(['account','cart','privacy'].includes(kind)?'dialogNotice':'supportBody')}</p>`;document.querySelector('#dialogBody').innerHTML=`<div class="dialog-header"><h2 id="dialogTitle">${title}</h2><button id="closeDialog" aria-label="${t('close')}">×</button></div>${content}<div class="preview-notice">${t('dialogNotice')}</div>`;document.querySelector('#dialog').showModal()}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.view){document.querySelector('#dialog').close();view=button.dataset.view;render(true)}else if(button.dataset.product){selected=examples.find(p=>p.id===button.dataset.product);variant=0;view='product';render(true)}else if(button.dataset.variant){variant=Number(button.dataset.variant);render()}else if(button.dataset.dialog)showDialog(button.dataset.dialog);else if(button.id==='language'){locale=locale==='en'?'fi':'en';render()}else if(button.id==='menu'){const open=document.querySelector('#mobileNav').classList.toggle('open');button.setAttribute('aria-expanded',String(open))}else if(button.id==='closeDialog')document.querySelector('#dialog').close();else if(button.id==='previewSubmit')document.querySelector('#previewResult').innerHTML=`<div class="preview-result">${t('previewSuccess')}</div>`});
function filter(){searchQuery=document.querySelector('#catalogSearch').value;materialType=document.querySelector('#materialType').value;const q=searchQuery.trim().toLowerCase();const type=materialType;const products=examples.filter(p=>(type==='all'||p.type===type)&&[p.name,p.fi||'',productName(p),...p.variants.map(v=>v[1])].join(' ').toLowerCase().includes(q));document.querySelector('#catalogRows').innerHTML=rows(products);document.querySelector('#resultCount').textContent=`${products.length} ${t('searchCount')} · ${locale==='en'?'layout sample':'ulkoasun esikatselu'}`}
document.addEventListener('input',event=>{if(event.target.id==='catalogSearch')filter()});document.addEventListener('change',event=>{if(event.target.id==='materialType')filter()});render();
</script>
</body>
