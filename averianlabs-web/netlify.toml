# Netlify config for the AverianLabs static demo.
#
# Build pipeline:
#   1. `pnpm install`         – restore deps
#   2. `pnpm build:demo`      – runs ./scripts/build-demo.sh, which forces
#                               BUILD_MODE=demo and `next build` with
#                               `output: "export"`. The script writes the
#                               static site to ./out.
#
# The deploy publishes ./out and serves it with Netlify's CDN. There are no
# Functions, no Edge Functions, and no background workers — purely static.

[build]
  base    = "averianlabs-web"
  command = "pnpm install --frozen-lockfile && pnpm build:demo"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  # The build script sets BUILD_MODE=demo and NODE_ENV=production itself, but
  # we declare them here so Netlify's deploy context inherits the same intent.
  BUILD_MODE = "demo"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

# Cache pnpm store between builds to keep install fast.
[[cache]]
  path = "averianlabs-web/node_modules/.pnpm-store"

# Locale-prefix rewrite: the production app uses middleware to 307 → /en/...
# when a request hits a non-locale path. The static demo can't run middleware
# at request time, so we replicate the same behaviour with Netlify's redirect
# engine. Bare paths redirect to the user's preferred locale (default /en/);
# every other top-level path gets the same prefix.
[[redirects]]
  from = "/"
  to   = "/en/"
  status = 302
  conditions = { Language = ["en"] }

[[redirects]]
  from = "/"
  to   = "/fi/"
  status = 302
  conditions = { Language = ["fi"] }

[[redirects]]
  from = "/"
  to   = "/de/"
  status = 302
  conditions = { Language = ["de"] }

[[redirects]]
  from = "/"
  to   = "/sv/"
  status = 302
  conditions = { Language = ["sv"] }

[[redirects]]
  from = "/"
  to   = "/nl/"
  status = 302
  conditions = { Language = ["nl"] }

# Catch-all: any bare path that didn't match a known locale → /<defaultLocale>.
# Each top-level route we ship in demo gets the same 302 prefix. Static asset
# extensions are skipped because Next emits real files for them.
[[redirects]]
  from = "/about"
  to   = "/en/about"
  status = 302

