name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: [5432:5432]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      TEST_DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-do-not-use-anywhere-real-0000000000
      AUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_local_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_local_test
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_local_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:i18n
      - run: pnpm check:i18n:usage
      # The browser payload is scoped per route and per namespace; a stale
      # allowlist would silently drop a message at runtime.
      - run: pnpm check:i18n:slice
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm test:deployment
      - run: pnpm test:integration
      - run: pnpm test:coverage:integration
      - run: pnpm audit --prod --audit-level=high
  storefront:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: [5432:5432]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      TEST_DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-do-not-use-anywhere-real-0000000000
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec tsx scripts/seed-test-commerce.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm check:bundle
      # The browser suite starts its own server, and so do the accessibility,
      # narrow-viewport and runtime checks that follow it. Each one starts a
      # fresh server against the same build.
      - run: pnpm test:e2e
        env: { CI: "true" }
      # The accessibility smoke test and the Lighthouse budget were declared
      # but never run, so they could not fail anything.
      - run: pnpm test:a11y
      # A translated string is routinely longer than the English it replaces,
      # and a long compound word in a heading was enough to push a page past
      # a 320px viewport. Every route in every locale is checked.
      - run: pnpm check:narrow
      # Walks every route in every locale and fails on a console error, an
      # uncaught exception, a failed request, a missing translation or an
      # uninterpolated placeholder.
      - run: pnpm check:runtime
      - run: pnpm check:lh
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
