name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: [5432:5432]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-do-not-use-anywhere-real-0000000000
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --reporter=verbose
      # ORG-01: fail the build if any NEXT_PUBLIC_LEGAL_* env var is still a
      # placeholder (FI-PENDING, "Address pending", etc). Skipped in demo builds.
      - run: pnpm legal:check
        env:
          NEXT_PUBLIC_LEGAL_COMPANY_NAME: "AverianLabs Oy"
          NEXT_PUBLIC_LEGAL_BUSINESS_ID: "1111111-1"
          NEXT_PUBLIC_LEGAL_VAT_ID: "FI11111111"
          NEXT_PUBLIC_LEGAL_ADDRESS_LINE1: "Mannerheimintie 1"
          NEXT_PUBLIC_LEGAL_ADDRESS_LINE2: "00100 Helsinki, Finland"
          NEXT_PUBLIC_LEGAL_EMAIL: "hello@averianlabs.eu"
      - name: Audit prod dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false
      # Skips cleanly when DATABASE_URL / MINIMAX_API_KEY are not configured.
      - run: pnpm ai:eval
        continue-on-error: true

  bundle-size:
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-do-not-use-anywhere-real-0000000000
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Assert shared bundle stays under Phase 3 plan target
        run: node scripts/check-bundle-size.mjs --strict

  i18n:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Assert every translation key exists in every locale
        run: pnpm check:i18n

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm test

  e2e:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: [5432:5432]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      AUTH_SECRET: ci-only-secret-do-not-use-anywhere-real-0000000000
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm test:e2e
        env:
          CI: "true"

  a11y:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Start server
        run: pnpm start &
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/en > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready" && exit 1
      - run: pnpm test:a11y

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
